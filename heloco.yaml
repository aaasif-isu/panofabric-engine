# run_heloco.py config: run one or more decentralized training methods (HeLoCo, DiLoCo, etc.)
# sequentially on the same dataset, with metrics and comparison plots.
#
# Usage:
#   python run_heloco.py                    # reads this file automatically
#   python run_heloco.py --methods heloco,diloco --steps 50  # CLI overrides
#
# Every key is a run_heloco.py option (underscored). Any flag typed on the command line
# overrides values here. Remove/comment a key to fall back to the default.

# ================================================================ METHODS & COMPARISON
# List of decentralized training methods to run, one after another.
# Each gets its own subdirectory in log_dir with independent logs and metrics.
# A combined comparison_loss.png plot is generated at the end.
#
# Available: heloco, diloco, mla
methods: [heloco, mla, diloco]

# ================================================================ TOPOLOGY
islands: 4              # number of workers (trainer replicas) per method
gpus_per_island: 1      # GPUs per worker; FSDP-sharded inside each island
gpus: [0, 1, 2, 3]      # GPU ids to hand out, island by island

# ================================================================ MODEL & RECIPE
# IMPORTANT: `module` MUST be prefixed with "models." (e.g. "models.llama3_small",
# NOT "llama3_small"). Without the prefix, torchtitan treats the name as a
# built-in shorthand and silently loads ITS OWN model registry instead of ours
# -- which lacks the fault_tolerance/semi_sync support this launcher needs, and
# will fail with "Unrecognized options: --fault_tolerance.*" or a missing config.
#
# Pick ONE (module, config, hf_assets) triple below by uncommenting it.
# All models.llama3_small.* flavors use the built-in 2048-vocab debug tokenizer
# (no download needed -- training is from scratch, not fine-tuning real weights).
#
#   module: models.llama3_small   config: llama3_15m    ~13.6M params  (fastest, default)
#   module: models.llama3_small   config: llama3_500m   ~453.6M params
#   module: models.llama3_small   config: llama3_1b     ~940.7M params
#   module: models.llama3_small   config: llama3_4b     ~3.65B params  (needs more VRAM)
#
# Real pretrained-tokenizer options (need matching assets under ./assets/hf/):
#   module: models.qwen3          config: qwen3_0_6b    ~0.6B params  (assets/hf/Qwen3-0.6B, present)
#   module: models.qwen3          config: qwen3_1_7b    ~1.7B params  (needs assets/hf/Qwen3-1.7B, NOT downloaded)
#   module: models.llama3         config: llama3_8b     ~8B params    (needs assets/hf/Llama-3.1-8B, NOT downloaded)
#
# EleutherAI Pythia (genuine GPT-NeoX architecture, not a Llama emulation --
# see models/pythia/__init__.py). All four share one GPT-NeoX-BPE tokenizer
# (vocab_size=50304); NOT downloaded by this repo -- fetch it once with:
#   heloco/bin/hf download EleutherAI/pythia-70m tokenizer.json \
#       tokenizer_config.json --local-dir assets/hf/pythia
#   module: models.pythia         config: pythia_14m    ~14M params   (needs assets/hf/pythia, NOT downloaded)
#   module: models.pythia         config: pythia_70m    ~70M params   (needs assets/hf/pythia, NOT downloaded)
#   module: models.pythia         config: pythia_410m   ~410M params  (needs assets/hf/pythia, NOT downloaded)
#   module: models.pythia         config: pythia_1b     ~1B params    (needs assets/hf/pythia, NOT downloaded)

# ----------------------------------------------------------------
# SmolLM2 official model family
# Use for model-size scaling with REAL released model configurations rather
# than manually changing layers/heads.
#
# All SmolLM2 presets below:
#   - use the official architecture/config
#   - use the matching official tokenizer
#   - initialize weights randomly
#   - train FROM SCRATCH (no pretrained weights loaded)
#
# Available official sizes:
#
#   SmolLM2-135M:
#   module: models.hf_transformers   config: smollm2_135m
#   hf_assets: ./assets/hf/smollm2_135m
#
#   SmolLM2-360M:
#   module: models.hf_transformers   config: smollm2_360m
#   hf_assets: ./assets/hf/smollm2_360m
#
#   SmolLM2-1.7B:
#   module: models.hf_transformers   config: smollm2_1_7b
#   hf_assets: ./assets/hf/smollm2_1_7b
#
# NOTE: `hf_model` is intentionally NOT a heloco.yaml option.
# The model/config path is defined inside each SmolLM2 Python preset.
#
# ----------------------------------------------------------------
#
# See models/<module_without_prefix>/config_registry.py for the exact preset body.
# module: models.llama3_small 
# config: llama3_15m

module: models.hf_transformers   
config: gemma3_1b #gemma3_1b, gemma3_270m, distilgpt2 (82m)


# Model assets: tokenizer (+ optional pretrained checkpoint). Must match the
# config chosen above -- see the table next to `config:` for the right pairing.
hf_assets: ./assets/tokenizer/debug
#hf_assets: assets/hf/Qwen3-0.6B
#hf_assets: ./assets/hf/pythia
#hf_assets: ./assets/hf/smollm2_135m
#hf_assets: ./assets/hf/smollm2_360m
#hf_assets: ./assets/hf/smollm2_1_7b
#hf_assets: ./assets/hf/gemma3_1b
#hf_assets: ./assets/hf/distilgpt2



# # SmolLM2-135M:
# module: models.hf_transformers
# config: hf_full
# #hf_model: ./assets/hf/smollm2_135m
# hf_assets: ./assets/hf/smollm2_135m

# ================================================================ TRAINING PARAMETERS
dataset: c4             # torchtitan dataset name (streams from HF Hub)
steps: 100              # inner training steps per island
seq_len: 512            # sequence length
batch: 8                # local batch size per GPU rank

# Dynamic training-token budget (tokens-per-parameter rule), e.g. Chinchilla-style
# "N params x tokens_per_parameter" sizing:
#   target_training_tokens = model_parameter_count * tokens_per_parameter
# This target is the GLOBAL budget for the WHOLE distributed experiment across
# ALL islands combined -- NOT per island (increasing `islands` does not inflate
# the intended ratio; it only spreads the same global budget over more workers).
#
# When set (not null), `steps` above is IGNORED and recomputed as:
#   tokens_per_step = batch * seq_len * gpus_per_island * islands   (one local
#                      training step per island per round; every preset here
#                      leaves training.global_batch_size unset, i.e. 1
#                      gradient-accumulation step)
#   steps = ceil(target_training_tokens / tokens_per_step)
#
# Set to null to disable and use the manually configured `steps` above unchanged
# (the two are never applied together).
#   tokens_per_parameter: 20   -> e.g. 15M model => ~300M total training tokens
#   tokens_per_parameter: null -> use `steps` as configured (default)
tokens_per_parameter: null

# ================================================================ REPRODUCIBILITY
# Random seed for Python, NumPy, PyTorch (CPU/CUDA), DataLoader shuffling, etc.
# Same seed ensures reproducible results across runs (subject to PyTorch/CUDA limitations).
seed: 42

# ================================================================ DATA DISTRIBUTION
# data_distribution: iid, non_iid, or both
# - iid:      all islands see same language (C4 English, default, IID data)
# - non_iid:  each island sees different language(s) from C4
# - both:     run IID first, then non_iid sequentially
#
# For non_iid/both mode, specify one language per island.
# Available C4 languages: english, french, german, spanish, italian, portuguese,
#                         romanian, dutch, greek, czech, polish, hungarian,
#                         croatian, swedish, finnish, danish, bulgarian, lithuanian,
#                         slovene, slovak, irish, maltese
#
data_distribution: iid  # or: iid, non_iid, both
languages: [english, french , german, spanish]  # per-island languages (only used if non_iid/both)

# ================================================================ ASYNC COORDINATION
# Coordination method: sync (torchft barrier) or async (HTTP push/pull)
# - sync:  window-synchronous with torchft semi_sync_method=heloco (staleness=0)
# - async: fully asynchronous via AsyncDiLoCoServer/HeLoCoServer with staleness weighting
coordination_method: async    # or: async
async_interval: 1            # check staleness every N window pulses (async only)
max_wait_time: 0.0           # max seconds to wait for server response; 0.0 = no timeout

# ================================================================ DECENTRALIZED TRAINING
# These settings apply to ALL methods. They can be varied per-method by modifying
# the code or running separate config files.

# HeLoCo / DiLoCo / MLA window
sync_steps: 20          # window H: inner steps between pushes to parameter server
num_fragments: 1        # fragment-wise sync; must divide sync_steps (1 = whole model)

# ================================================================ HETEROGENEITY SIMULATION
# Simulate heterogeneous (different-speed) islands for testing straggler robustness.
# One factor per island, same order as `gpus`/`languages`.
# Default: null -> [1.0, 1.0, ...] (all islands same speed, no artificial delay)
# Example: [1, 5, 3, 14] means island 0 is normal, 1 is 5x slower, 2 is 3x slower, 3 is 14x slower
# Mechanism: run_heloco.py exports $PF_ISLAND_SLOWNESS_FACTOR per island (torchtitan's
# fault_tolerance config has no such flag), and panoengine's AsyncDiLoCo worker
# (panoengine/decentralized/async_diloco.py) sleeps extra time proportional to
# (factor - 1) after every inner optimizer step.
island_slowness_factors: [1, 1.5, 2, 1.3]  # null = default [1.0, 1.0, ...] for all islands
#island_slowness_factors: null

# Server-side outer optimizer (HeLoCo, DiLoCo, MLA)
outer_lr: 0.7           # outer learning rate (HeLoCoOptimizer / MLAOptimizer)
outer_momentum: 0.9     # momentum
rho: null               # HeLoCo arrival weight; null -> auto (1/sqrt(islands))
should_quantize: false  # int8 pseudo-gradient upload (reduces comm)

# MLA uses only: outer_lr, outer_momentum
# MLA = simple momentum look-ahead on server: m <- γ·m + (1−γ)·Δ, θ <- θ − lr·(γ·m + Δ)
# No direction correction for base MLA (that's SmartDCMLA_v2, a separate advanced variant)

# ================================================================ HELOCO CORRECTION CONTROL
# Which islands (by index, matching --fault_tolerance.replica_id / the `gpus`
# ordering) get HeLoCo's Algorithm-2 tensor-block directional correction on
# the parameter server. Islands NOT selected still train and communicate
# exactly as normal (push/pull every sync_steps) -- they just bypass the
# correction step and are committed as plain (uncorrected) async DiLoCo.
#   all       -> every island is corrected (default; matches prior behavior)
#   [0]       -> only island 0 is corrected; islands 1..N-1 are plain DiLoCo
#   [0, 2]    -> islands 0 and 2 are corrected; the rest are plain DiLoCo
#   none      -> no island is corrected (every island is plain DiLoCo)
correction_workers: all

# Granularity of the correction decision:
#   tensorwise     -> one cosine/confidence/correction decision PER TENSOR
#                     (Algorithm 2 exactly as published; default, unchanged
#                     behavior)
#   whole_gradient -> flatten the worker's entire pseudo-gradient (and the
#                     matching momentum) into ONE logical vector and make a
#                     SINGLE cosine/confidence/correction decision for the
#                     whole update, applied consistently to every tensor
correction_scope: tensorwise

# When true (and correction_scope: tensorwise), record one row per
# worker/update/tensor with the cosine similarity, correction type
# (pass|rotate|shrink), and the (normalized) correction magnitude, so a
# tensor/block heatmap can be regenerated after training. Written under
# <method_log_dir>/correction_heatmap/correction_heatmap.csv. Only islands
# selected by correction_workers produce real correction statistics; a
# bypassed island logs nothing. With correction_scope: whole_gradient, one
# whole-update row is logged instead of per-tensor rows.
correction_heatmap: true

# What islands NOT selected by correction_workers get instead of HeLoCo's
# Algorithm-2 directional correction:
#   heloco_uncorrected -> (default) still HeLoCoOptimizer/MLA update +
#                          HeLoCo look-ahead dispatch; only the directional
#                          correction step is skipped (ablates correction
#                          only).
#   diloco             -> those islands are TRUE async DiLoCo: committed
#                          through a separate DelayedNesterovOptimizer (its
#                          own independent momentum state -- never shares or
#                          reuses HeLoCo's momentum) and sent the plain
#                          global-model snapshot on pull, never the HeLoCo
#                          look-ahead one. Selected islands are unaffected
#                          either way (always full HeLoCo).
# Example: correction_workers: [0], other_islands_method: diloco means
# island 0 is full HeLoCo and islands 1..N-1 are true DiLoCo.
other_islands_method: diloco

# other_islands_method: diloco only -- hyperparameters for the separate
# true-DiLoCo optimizer used by non-selected islands. null -> reuse
# outer_lr / outer_momentum; diloco_nesterov_period null -> auto (number of
# non-selected islands, minimum 1).
diloco_lr: null
diloco_momentum: null
diloco_nesterov_period: null

# ================================================================ INFRASTRUCTURE
host: 127.0.0.1
lighthouse_port: 29510  # rendezvous server port
ps_port: 29520          # parameter server port
rdzv_base_port: 29600   # island i rendezvous on rdzv_base_port + i
log_dir: outputs/heloco_run_debug_tok   # base directory; will be expanded to:
                              # outputs/heloco_run_{coordination_method}_{config}_{data_distribution}_{steps}
                              # Example: outputs/heloco_run_sync_qwen3_0_6b_iid_100
                              # Set custom value to disable this behavior
ps_timeout: 600         # seconds to wait for parameter server to announce addresses

# Extra torchtitan flags appended to every island's torchrun, e.g.
# ["--metrics.log_freq=5", "--training.max_norm=1.0"]
extra: []
